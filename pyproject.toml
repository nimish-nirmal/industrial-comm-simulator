[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "industrial-comm-simulator"
version = "1.0.0"
description = "A production-ready industrial protocol simulator with physics-backed device values supporting Modbus, BACnet, MQTT, OPC UA, Siemens S7, HTTP REST API, and Sparkplug B"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["industrial", "protocol", "simulator", "modbus", "bacnet", "mqtt", "opcua", "siemens", "sparkplug"]

authors = [
    {name = "Industrial Comm Simulator Contributors"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: System :: Networking",
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "paho-mqtt>=1.6.0",
    "pymodbus>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
modbus = ["pymodbus>=3.0.0"]
bacnet = ["bacpypes>=0.18.0"]
mqtt = ["paho-mqtt>=1.6.0"]
opcua = ["opcua-asyncio>=1.0.0"]
siemens = ["python-snap7>=1.3.0"]
http = []
sparkplug = ["paho-mqtt>=1.6.0", "protobuf>=4.0.0"]
dnp3 = ["pydnp3>=3.0.0"]
ethernetip = ["pycomm3>=1.2.0"]
profinet = []
canopen = ["canopen>=2.0.0"]
iec61850 = ["pyiec61850>=1.5.0"]
iec104 = []
websocket = ["websockets>=12.0"]
grpc = ["grpcio>=1.60.0", "protobuf>=4.0.0"]
all = [
    "pymodbus>=3.0.0",
    "bacpypes>=0.18.0",
    "paho-mqtt>=1.6.0",
    "opcua-asyncio>=1.0.0",
    "python-snap7>=1.3.0",
    "protobuf>=4.0.0",
    "pydnp3>=3.0.0",
    "pycomm3>=1.2.0",
    "canopen>=2.0.0",
    "pyiec61850>=1.5.0",
    "websockets>=12.0",
    "grpcio>=1.60.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
"Homepage" = "https://github.com/nimish-nirmal/industrial-comm-simulator"
"Source" = "https://github.com/nimish-nirmal/industrial-comm-simulator"
"Bug Tracker" = "https://github.com/nimish-nirmal/industrial-comm-simulator/issues"

[project.scripts]
industrial-sim = "src.main:main"
industrial-simulator = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.ini", "*.proto", "*.json"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]