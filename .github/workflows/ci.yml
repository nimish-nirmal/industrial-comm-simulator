# ═══════════════════════════════════════════════════════════════════
# Industrial Communication Simulator — CI Test Workflow
# ═══════════════════════════════════════════════════════════════════

name: Industrial Comm Simulator CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  MQTT_HOST: "localhost"
  MQTT_PORT: "1883"
  MQTT_CLIENT_ID: "industrial-simulator-ci"
  LOG_LEVEL: "WARNING"

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff mypy

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Type check (continue on error)
        continue-on-error: true
        run: |
          mypy src/ --ignore-missing-imports

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint-and-type-check]
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pydantic pydantic-settings
          pip install -e .

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=html --junitxml=test-results.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-type-check]
    services:
      mosquitto:
        image: eclipse-mosquitto:2.0.18
        ports:
          - 1883:1883
        volumes:
          - ./configs/mosquitto:/mosquitto/config:ro
        command: mosquitto -c /mosquitto/config/mosquitto.conf

    steps:
      - uses: actions/checkout@v5
        with:
          clean: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pymodbus paho-mqtt
          pip install -e .

      - name: Install Mosquitto clients
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mosquitto-clients

      - name: Wait for Mosquitto
        run: |
          for i in $(seq 1 30); do
            if mosquitto_pub -h localhost -t test -m "hello" 2>/dev/null; then
              echo "Mosquitto ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Run integration tests
        run: |
          if [ -f tests/test_integration.py ]; then
            python -m pytest tests/test_integration.py -v --junitxml=integration-results.xml
          else
            echo "No integration tests yet — skipping"
          fi

      - name: Upload integration results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: integration-results.xml
          retention-days: 7

  build-verify:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Verify Python compilation
        run: |
          python3 -c "
          import py_compile, glob, os
          errors = []
          for pyfile in glob.glob('src/**/*.py', recursive=True):
              try:
                  py_compile.compile(pyfile, doraise=True)
                  print(f'OK: {pyfile}')
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
                  print(f'FAIL: {pyfile}')
          if errors:
              exit(1)
          else:
              print('All Python files compile successfully')
          "

      - name: Verify protocol imports
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          
          protocols = [
              'modbus', 'bacnet', 'mqtt', 'opcua', 'siemens',
              'http', 'sparkplug', 'dnp3', 'ethernetip', 'profinet',
              'canopen', 'iec61850', 'iec104', 'websocket', 'grpc'
          ]
          
          for protocol in protocols:
              module = __import__(f'src.protocols.{protocol}', fromlist=['Engine'])
              engine_cls = getattr(module, [c for c in dir(module) if 'Engine' in c][0])
              engine = engine_cls(name='test')
              assert engine.protocol_name == protocol
              print(f'✓ {protocol}')
          
          print(f'✓ All {len(protocols)} protocols validated')
          "

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: industrial-simulator:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm industrial-simulator:test python3 -m src.main --list-protocols
          docker run --rm industrial-simulator:test python3 -m src.main --dry-run

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, unit-tests, integration-tests, build-verify, docker-build]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Lint & Type:     ${{ needs.lint-and-type-check.result }}"
          echo "Unit Tests:      ${{ needs.unit-tests.result }}"
          echo "Integration:     ${{ needs.integration-tests.result }}"
          echo "Build Verify:    ${{ needs.build-verify.result }}"
          echo "Docker Build:    ${{ needs.docker-build.result }}"
          if [ "${{ needs.lint-and-type-check.result }}" = "success" ] && \
             [ "${{ needs.unit-tests.result }}" = "success" ] && \
             [ "${{ needs.integration-tests.result }}" = "success" ] && \
             [ "${{ needs.build-verify.result }}" = "success" ] && \
             [ "${{ needs.docker-build.result }}" = "success" ]; then
            echo "All checks passed ✓"
          else
            echo "Some checks failed"
            exit 1
          fi